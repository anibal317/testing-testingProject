<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Club - Usuarios</title>
    <link rel="stylesheet" href="videoclub.css">
</head>
<body>
    <header class="vc-header">
        <nav class="vc-nav">
            <a href="../index.html" class="vc-logo">TechInfo Hub</a>
            <ul>
                <li><a href="videoclub.html">Video Club</a></li>
                <li><a href="videoclub-users.html" class="active">Usuarios</a></li>
            </ul>
        </nav>
    </header>

    <main class="vc-main">
        <section class="vc-module-nav">
            <a href="videoclub.html">Resumen</a>
            <a href="videoclub-movies.html">Peliculas</a>
            <a href="videoclub-customers.html">Clientes</a>
            <a href="videoclub-rentals.html">Alquileres</a>
            <a href="videoclub-users.html" class="active">Usuarios</a>
            <a href="videoclub-candybar.html">Candy Bar</a>
        </section>

        <section class="vc-card vc-control-card">
            <div class="vc-two-column-form">
                <div>
                    <label for="vc-base-url">Base URL</label>
                    <input id="vc-base-url" type="url" value="https://be-testing-project.vercel.app" required>
                </div>
            </div>
            <div class="vc-button-row">
                <button type="button" id="vc-refresh-all">Actualizar datos</button>
            </div>
        </section>

        <section class="vc-card">
            <div class="vc-card-heading">
                <div>
                    <h2>CRUD de usuarios</h2>
                </div>
                <span id="vc-user-form-mode" class="vc-section-chip">Alta</span>
            </div>
            <form id="vc-user-form" class="vc-stack-form">
                <input id="vc-user-id" type="hidden">
                <div class="vc-two-column-form">
                    <div>
                        <label for="vc-user-email">Correo</label>
                        <input id="vc-user-email" type="email" required>
                    </div>
                    <div>
                        <label for="vc-user-role">Rol</label>
                        <select id="vc-user-role">
                            <option value="client">client</option>
                            <option value="admin">admin</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label for="vc-user-password">Contrasena</label>
                    <input id="vc-user-password" type="password" placeholder="Opcional en edicion">
                </div>
                <div class="vc-button-row">
                    <button type="submit">Guardar usuario</button>
                    <button type="button" id="vc-user-reset" class="ghost">Limpiar</button>
                </div>
            </form>
            <div class="vc-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="vc-users-body">
                        <tr><td colspan="4">Sin usuarios cargados.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="vc-card vc-response-card">
            <pre id="vc-output">Sin requests ejecutadas.</pre>
        </section>
    </main>

    <script src="videoclub.js"></script>
</body>
</html>
