<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Club - Clientes</title>
    <link rel="stylesheet" href="videoclub.css">
</head>
<body>
    <header class="vc-header">
        <nav class="vc-nav">
            <a href="../index.html" class="vc-logo">TechInfo Hub</a>
            <ul>
                <li><a href="videoclub.html">Video Club</a></li>
                <li><a href="videoclub-customers.html" class="active">Clientes</a></li>
            </ul>
        </nav>
    </header>

    <main class="vc-main">
        <section class="vc-module-nav">
            <a href="videoclub.html">Resumen</a>
            <a href="videoclub-movies.html">Peliculas</a>
            <a href="videoclub-customers.html" class="active">Clientes</a>
            <a href="videoclub-rentals.html">Alquileres</a>
            <a href="videoclub-users.html">Usuarios</a>
            <a href="videoclub-candybar.html">Candy Bar</a>
        </section>

        <section class="vc-card vc-control-card">
            <div class="vc-two-column-form">
                <div>
                    <label for="vc-base-url">Base URL</label>
                    <input id="vc-base-url" type="url" value="https://be-testing-project.vercel.app" required>
                </div>
                <div>
                    <label for="vc-customer-select">Cliente activo</label>
                    <select id="vc-customer-select"><option value="">Cargando clientes...</option></select>
                </div>
            </div>
            <div class="vc-button-row">
                <button type="button" id="vc-refresh-all">Actualizar datos</button>
                <button type="button" id="vc-load-history" class="ghost">Ver historial</button>
                <button type="button" id="vc-clear-history" class="ghost">Limpiar historial</button>
            </div>
            <span id="vc-selected-customer-pill" class="vc-pill">Cliente no seleccionado</span>
        </section>

        <section class="vc-card">
            <div class="vc-card-heading">
                <div>
                    <h2>CRUD de clientes</h2>
                </div>
                <span id="vc-customer-form-mode" class="vc-section-chip">Alta</span>
            </div>
            <form id="vc-customer-form" class="vc-stack-form">
                <input id="vc-customer-id" type="hidden">
                <div class="vc-two-column-form">
                    <div>
                        <label for="vc-customer-name">Nombre</label>
                        <input id="vc-customer-name" type="text" required>
                    </div>
                    <div>
                        <label for="vc-customer-email">Correo</label>
                        <input id="vc-customer-email" type="email" required>
                    </div>
                </div>
                <div class="vc-two-column-form">
                    <div>
                        <label for="vc-customer-phone">Telefono</label>
                        <input id="vc-customer-phone" type="tel">
                    </div>
                    <div>
                        <label for="vc-customer-address">Direccion</label>
                        <input id="vc-customer-address" type="text">
                    </div>
                </div>
                <div class="vc-button-row">
                    <button type="submit">Guardar cliente</button>
                    <button type="button" id="vc-customer-reset" class="ghost">Limpiar</button>
                </div>
            </form>
            <div class="vc-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Telefono</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="vc-customers-body">
                        <tr><td colspan="5">Sin clientes cargados.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="vc-card">
            <h2>Historial del cliente</h2>
            <div class="vc-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Pelicula</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="vc-history-body">
                        <tr><td colspan="3">Sin historial cargado.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="vc-card vc-response-card">
            <pre id="vc-output">Sin requests ejecutadas.</pre>
        </section>
    </main>

    <script src="videoclub.js"></script>
</body>
</html>
