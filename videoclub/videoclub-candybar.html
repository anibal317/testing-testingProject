<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Club - Candy Bar</title>
    <link rel="stylesheet" href="videoclub.css">
</head>
<body>
    <header class="vc-header">
        <nav class="vc-nav">
            <a href="../index.html" class="vc-logo">TechInfo Hub</a>
            <ul>
                <li><a href="videoclub.html">Video Club</a></li>
                <li><a href="videoclub-candybar.html" class="active">Candy Bar</a></li>
            </ul>
        </nav>
    </header>

    <main class="vc-main">
        <section class="vc-module-nav">
            <a href="videoclub.html">Resumen</a>
            <a href="videoclub-movies.html">Peliculas</a>
            <a href="videoclub-customers.html">Clientes</a>
            <a href="videoclub-rentals.html">Alquileres</a>
            <a href="videoclub-users.html">Usuarios</a>
            <a href="videoclub-candybar.html" class="active">Candy Bar</a>
        </section>

        <section class="vc-card vc-control-card">
            <div class="vc-two-column-form">
                <div>
                    <label for="vc-base-url">Base URL</label>
                    <input id="vc-base-url" type="url" value="https://be-testing-project.vercel.app" required>
                </div>
            </div>
            <div class="vc-button-row">
                <button type="button" id="vc-refresh-all">Actualizar datos</button>
            </div>
        </section>

        <section class="vc-card">
            <div class="vc-card-heading">
                <div>
                    <h2>CRUD de candy bar</h2>
                </div>
                <span id="vc-candy-form-mode" class="vc-section-chip">Alta</span>
            </div>
            <form id="vc-candy-form" class="vc-stack-form">
                <input id="vc-candy-id" type="hidden">
                <div class="vc-two-column-form">
                    <div>
                        <label for="vc-candy-name">Nombre</label>
                        <input id="vc-candy-name" type="text" required>
                    </div>
                    <div>
                        <label for="vc-candy-category">Categoria</label>
                        <input id="vc-candy-category" type="text">
                    </div>
                </div>
                <div class="vc-two-column-form">
                    <div>
                        <label for="vc-candy-price">Precio</label>
                        <input id="vc-candy-price" type="number" min="0" step="0.01" required>
                    </div>
                    <div>
                        <label for="vc-candy-stock">Stock</label>
                        <input id="vc-candy-stock" type="number" min="0" step="1">
                    </div>
                </div>
                <div class="vc-button-row">
                    <button type="submit">Guardar producto</button>
                    <button type="button" id="vc-candy-reset" class="ghost">Limpiar</button>
                </div>
            </form>
            <div class="vc-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Categoria</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="vc-candy-body">
                        <tr><td colspan="6">Sin productos cargados.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="vc-card vc-response-card">
            <pre id="vc-output">Sin requests ejecutadas.</pre>
        </section>
    </main>

    <script src="videoclub.js"></script>
</body>
</html>
